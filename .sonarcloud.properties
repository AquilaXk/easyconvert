# Read by SonarCloud automatic analysis; no workflow runs a scanner, so this is the only Sonar settings file.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.exclusions=tests/fixtures/**,public/**,scripts/**,sdk/**
# No coverage report is produced or imported (automatic analysis cannot read one), so coverage is left out of the analysis
# instead of reading as 0% on new code.
sonar.coverage.exclusions=**
sonar.cpd.exclusions=src/lib/storage/**,src/lib/registry.ts,src/lib/slug-parser.ts,src/lib/conversions/cad-nurbs.ts,src/lib/conversions/ocr-pdf-combiner.ts,src/lib/edge-ocr/**,src/lib/jobs/**,app/**,app/**/*,src/app/**,src/app/**/*,**/*page.tsx,src/components/Footer.tsx,tests/**,**/tests/**,**/*.test.ts,sdk/**
sonar.issue.ignore.multicriteria=e1
# The RFC 1918 and CDN range tables are public network constants, not deployment-specific hardcoded addresses.
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=src/lib/security/client-ip.ts
