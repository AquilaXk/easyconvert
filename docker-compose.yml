version: '3.8'

# Local development: `docker compose up` starts Redis and a worker that keeps objects on the shared
# volume (STORAGE_DRIVER=local, NODE_ENV=development). It asks for no cloud setting and no secret.
#
# Production: add the overlay, which switches the workers to NODE_ENV=production and refuses to
# start without a storage driver and a signing secret (>= 32 bytes, `openssl rand -hex 32`):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# See docker-compose.prod.yml for the OCI_* / S3_* variables each driver needs.

services:
  # 1. Distributed Queue Broker
  redis:
    image: redis:7-alpine
    container_name: easyconvert-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 2. EasyConvert OCI Backend Worker Daemon (CPU / Default)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: easyconvert-oci-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=8g,noexec,nosuid
      - /home/easyconvert:size=512m,nosuid,nodev
    pids_limit: 256
    ulimits:
      nproc: 256
      nofile:
        soft: 65536
        hard: 65536
      fsize: 10737418240
    cap_drop:
      - ALL
    # Security Note: SYS_ADMIN capability is deliberately removed for zero-trust least privilege
    # (Previously added for unshare; removed to prevent container breakout)
    # cap_add: SYS_ADMIN [REMOVED]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    environment:
      # Local mode: no cloud account and no secret are needed. Production values live in
      # docker-compose.prod.yml (see the note at the top of this file).
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_DRIVER=local
      # Optional: only needed to sign upload and download URLs. Unset, signing is refused, never faked.
      - STORAGE_SIGNING_SECRET=${STORAGE_SIGNING_SECRET:-}
      - WORKER_CONCURRENCY=3
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
    volumes:
      - shared-storage:/shared/storage
      # Replaced worker-tmp:/tmp with secure tmpfs /tmp:size=8g,noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 10G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 3. EasyConvert OCI Backend Worker Daemon (GPU Profile with VA-API /dev/dri)
  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: easyconvert-oci-worker-gpu
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=8g,noexec,nosuid
      - /home/easyconvert:size=512m,nosuid,nodev
    pids_limit: 256
    ulimits:
      nproc: 256
      nofile:
        soft: 65536
        hard: 65536
      fsize: 10737418240
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri
    profiles:
      - gpu
    depends_on:
      - redis
    environment:
      # Local mode: no cloud account and no secret are needed. Production values live in
      # docker-compose.prod.yml (see the note at the top of this file).
      - NODE_ENV=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORAGE_DRIVER=local
      # Optional: only needed to sign upload and download URLs. Unset, signing is refused, never faked.
      - STORAGE_SIGNING_SECRET=${STORAGE_SIGNING_SECRET:-}
      - WORKER_CONCURRENCY=3
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
      - HWACCEL_ENABLED=true
    volumes:
      - shared-storage:/shared/storage
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 12G
        reservations:
          cpus: '1.0'
          memory: 2G

volumes:
  redis-data:
  shared-storage:
