version: '3.8'

services:
  # 1. Distributed Queue Broker
  redis:
    image: redis:7-alpine
    container_name: easyconvert-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 2. EasyConvert OCI Backend Worker Daemon (Base / CPU Default)
  worker: &worker-base
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: easyconvert-oci-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=8g,noexec,nosuid
      - /tmp:size=8g,noexec,nosuid,nodev
      - /home/easyconvert:size=512m,nosuid,nodev
    pids_limit: 256
    ulimits:
      nproc: 256
      nofile:
        soft: 65536
        hard: 65536
      fsize: 10737418240
    cap_drop:
      - ALL
    # Security Note: SYS_ADMIN capability is deliberately removed for zero-trust least privilege
    # (Previously added for unshare; removed to prevent container breakout)
    # cap_add: SYS_ADMIN [REMOVED]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCI_NAMESPACE
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME:-easyconvert-transcode-bucket}
      - OCI_REGION=${OCI_REGION:-ap-seoul-1}
      - OCI_ENDPOINT
      - STORAGE_SIGNING_SECRET
      - S3_SIGNING_SECRET
      - OCI_SIGNING_SECRET
      - AWS_ACCESS_KEY_ID
      - S3_ACCESS_KEY_ID
      - WORKER_CONCURRENCY=3
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
    volumes:
      - shared-storage:/shared/storage
      # Replaced worker-tmp:/tmp with secure tmpfs /tmp:size=8g,noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 10G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 3. Split Profile Worker: Light Queue (Fast I/O & Metadata)
  worker-light:
    <<: *worker-base
    container_name: easyconvert-oci-worker-light
    profiles:
      - split
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCI_NAMESPACE
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME:-easyconvert-transcode-bucket}
      - OCI_REGION=${OCI_REGION:-ap-seoul-1}
      - OCI_ENDPOINT
      - STORAGE_SIGNING_SECRET
      - S3_SIGNING_SECRET
      - OCI_SIGNING_SECRET
      - AWS_ACCESS_KEY_ID
      - S3_ACCESS_KEY_ID
      - WORKER_CONCURRENCY=3
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
      - WORKER_QUEUES=light
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.2'
          memory: 256M

  # 4. Split Profile Worker: CPU Queue (Heavy Software Transcoding & Documents)
  worker-cpu:
    <<: *worker-base
    container_name: easyconvert-oci-worker-cpu
    profiles:
      - split
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCI_NAMESPACE
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME:-easyconvert-transcode-bucket}
      - OCI_REGION=${OCI_REGION:-ap-seoul-1}
      - OCI_ENDPOINT
      - STORAGE_SIGNING_SECRET
      - S3_SIGNING_SECRET
      - OCI_SIGNING_SECRET
      - AWS_ACCESS_KEY_ID
      - S3_ACCESS_KEY_ID
      - WORKER_CONCURRENCY=3
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
      - WORKER_QUEUES=cpu,default
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 5. Split Profile Worker: Memory Queue (CAD & OCR High Memory)
  worker-memory:
    <<: *worker-base
    container_name: easyconvert-oci-worker-memory
    profiles:
      - split
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCI_NAMESPACE
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME:-easyconvert-transcode-bucket}
      - OCI_REGION=${OCI_REGION:-ap-seoul-1}
      - OCI_ENDPOINT
      - STORAGE_SIGNING_SECRET
      - S3_SIGNING_SECRET
      - OCI_SIGNING_SECRET
      - AWS_ACCESS_KEY_ID
      - S3_ACCESS_KEY_ID
      - WORKER_CONCURRENCY=2
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
      - WORKER_QUEUES=memory
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 12G
        reservations:
          cpus: '0.5'
          memory: 2G

  # 6. Split Profile Worker: GPU Profile (VA-API /dev/dri Hardware Acceleration)
  worker-gpu:
    <<: *worker-base
    container_name: easyconvert-oci-worker-gpu
    devices:
      - /dev/dri:/dev/dri
    profiles:
      - gpu
      - split
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCI_NAMESPACE
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME:-easyconvert-transcode-bucket}
      - OCI_REGION=${OCI_REGION:-ap-seoul-1}
      - OCI_ENDPOINT
      - STORAGE_SIGNING_SECRET
      - S3_SIGNING_SECRET
      - OCI_SIGNING_SECRET
      - AWS_ACCESS_KEY_ID
      - S3_ACCESS_KEY_ID
      - WORKER_CONCURRENCY=3
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
      - HWACCEL_ENABLED=true
      - WORKER_QUEUES=gpu
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 12G
        reservations:
          cpus: '1.0'
          memory: 2G

volumes:
  redis-data:
  shared-storage:
