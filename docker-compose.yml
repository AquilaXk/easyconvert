version: '3.8'

services:
  # 1. Distributed Queue Broker
  redis:
    image: redis:7-alpine
    container_name: easyconvert-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 2. EasyConvert OCI Backend Worker Daemon (CPU / Default)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: easyconvert-oci-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=8g,noexec,nosuid
      - /home/easyconvert:size=512m,nosuid,nodev
    pids_limit: 256
    ulimits:
      nproc: 256
      nofile:
        soft: 65536
        hard: 65536
      fsize: 10737418240
    cap_drop:
      - ALL
    # Security Note: SYS_ADMIN capability is deliberately removed for zero-trust least privilege
    # (Previously added for unshare; removed to prevent container breakout)
    # cap_add: SYS_ADMIN [REMOVED]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      # Required: workers open the sealed URLs and headers of queued jobs and refuse to start without it.
      - JOB_SECRET_KEK=${JOB_SECRET_KEK:?set a random secret of at least 32 bytes}
      - JOB_SECRET_KEK_PREVIOUS=${JOB_SECRET_KEK_PREVIOUS:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCI_NAMESPACE=${OCI_NAMESPACE:-local-dev-tenancy}
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME:-easyconvert-transcode-bucket}
      - OCI_REGION=${OCI_REGION:-ap-seoul-1}
      - OCI_ENDPOINT=${OCI_ENDPOINT:-https://local-dev-tenancy.compat.objectstorage.ap-seoul-1.oraclecloud.com}
      - STORAGE_SIGNING_SECRET=${STORAGE_SIGNING_SECRET:-easyconvert-local-dev-signing-secret}
      - S3_SIGNING_SECRET=${S3_SIGNING_SECRET:-easyconvert-local-dev-signing-secret}
      - OCI_SIGNING_SECRET=${OCI_SIGNING_SECRET:-easyconvert-local-dev-signing-secret}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local-dev-access-key}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-local-dev-access-key}
      - WORKER_CONCURRENCY=3
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
    volumes:
      - shared-storage:/shared/storage
      # Replaced worker-tmp:/tmp with secure tmpfs /tmp:size=8g,noexec,nosuid
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 10G
        reservations:
          cpus: '0.5'
          memory: 1G

  # 3. EasyConvert OCI Backend Worker Daemon (GPU Profile with VA-API /dev/dri)
  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: easyconvert-oci-worker-gpu
    restart: unless-stopped
    init: true
    stop_grace_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=8g,noexec,nosuid
      - /home/easyconvert:size=512m,nosuid,nodev
    pids_limit: 256
    ulimits:
      nproc: 256
      nofile:
        soft: 65536
        hard: 65536
      fsize: 10737418240
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/dri:/dev/dri
    profiles:
      - gpu
    depends_on:
      - redis
    environment:
      - NODE_ENV=production
      # Required: workers open the sealed URLs and headers of queued jobs and refuse to start without it.
      - JOB_SECRET_KEK=${JOB_SECRET_KEK:?set a random secret of at least 32 bytes}
      - JOB_SECRET_KEK_PREVIOUS=${JOB_SECRET_KEK_PREVIOUS:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OCI_NAMESPACE=${OCI_NAMESPACE:-local-dev-tenancy}
      - OCI_BUCKET_NAME=${OCI_BUCKET_NAME:-easyconvert-transcode-bucket}
      - OCI_REGION=${OCI_REGION:-ap-seoul-1}
      - OCI_ENDPOINT=${OCI_ENDPOINT:-https://local-dev-tenancy.compat.objectstorage.ap-seoul-1.oraclecloud.com}
      - STORAGE_SIGNING_SECRET=${STORAGE_SIGNING_SECRET:-easyconvert-local-dev-signing-secret}
      - S3_SIGNING_SECRET=${S3_SIGNING_SECRET:-easyconvert-local-dev-signing-secret}
      - OCI_SIGNING_SECRET=${OCI_SIGNING_SECRET:-easyconvert-local-dev-signing-secret}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local-dev-access-key}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-local-dev-access-key}
      - WORKER_CONCURRENCY=3
      - EASYCONVERT_STORAGE_DIR=/shared/storage
      - STRICT_SANDBOX=true
      - HWACCEL_ENABLED=true
    volumes:
      - shared-storage:/shared/storage
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 12G
        reservations:
          cpus: '1.0'
          memory: 2G

volumes:
  redis-data:
  shared-storage:
