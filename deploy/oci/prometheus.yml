# Production Prometheus configuration for EasyConvert (docs/slo.md, deploy/oci/prometheus-alerts.yml).
# Runs inside the internal `backend` network under `--profile monitoring` with no host port published.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: easyconvert-web
    metrics_path: /metrics
    static_configs:
      - targets:
          - web:9464

  - job_name: easyconvert-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - worker
          - worker-light
          - worker-cpu
          - worker-memory
          - worker-gpu
        type: A
        port: 9465
        refresh_interval: 15s
