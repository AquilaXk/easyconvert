# Site file for the shared host nginx. Install (docs/deploy-oci.md): sudo install -m 0644 deploy/oci/nginx-easyconvert.conf
# /etc/nginx/sites-available/easyconvert, then link it into sites-enabled. The file holds http-level directives and one server, and the
# Debian nginx.conf includes sites-enabled inside http, as it does for the other site.
#
# It adds one server for the EasyConvert domain and touches nothing else: no default_server (the 444 default of the other site stays
# the only one on port 443), no listener on port 80 (it is closed at the cloud firewall), and every http-level name below starts with
# easyconvert_ so it cannot collide with a name the other site defines.
#
# Certificate: an origin certificate that the CDN in front of the origin issues for the domain, installed by hand at /etc/ssl/easyconvert/origin.pem and origin.key
# (mode 0600, owner root) with the CDN's SSL mode set to Full (strict). DNS-01 renewal would need a DNS API token stored on this host
# and HTTP-01 needs port 80; the origin certificate needs neither, is valid for up to 15 years and is trusted only by the CDN, which is
# the only client the firewall lets reach port 443.

limit_req_zone $binary_remote_addr zone=easyconvert_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=easyconvert_convert:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=easyconvert_conn:10m;

map $status $easyconvert_edge_loggable {
    default 0;
    429 1;
    "~^[45]" 1;
}

map $uri $easyconvert_edge_location {
    default "page";
    "~^/api/v1/uploads" "upload";
    "~^/api/(v1/)?convert" "convert";
    "~^/api/storage/" "storage";
    "~^/api/" "api";
}

log_format easyconvert_edge_json escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"status":"$status",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"location":"$easyconvert_edge_location",'
    '"bytes_sent":"$body_bytes_sent",'
    '"request_time":"$request_time"}';

upstream easyconvert_web {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name convert.aquilaxk.site;
    access_log /var/log/nginx/easyconvert-edge.log easyconvert_edge_json if=$easyconvert_edge_loggable;

    ssl_certificate /etc/ssl/easyconvert/origin.pem;
    ssl_certificate_key /etc/ssl/easyconvert/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The CDN's published ranges (its IPv4 and IPv6 address lists, checked 2026-10-30). The peer must be inside them for
    # CF-Connecting-IP to be believed, so a client that reaches the port some other way keeps its own address.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @easyconvert_rate_limited;

    location @easyconvert_rate_limited {
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"success":false,"error":"Too many requests"}';
    }

    # The largest request body this host takes in one request. The application takes 65 MiB of body in one request (a file of 64 MiB
    # and 1 MiB of form fields, SINGLE_REQUEST_BODY_MAX_BYTES in src/lib/plan-limits.ts) and answers 413 for more, so this limit only
    # has to be larger than that. The free plan of the CDN refuses bodies over 100 MB before they reach this host, so the edge limit
    # is the tighter one for a request that crosses it. The file limit of a plan is larger; files past 64 MiB go up in parts
    # (/api/storage/multipart, at most 64 MiB each) or by the resumable upload, never in one request.
    client_max_body_size 101m;
    client_body_timeout 300s;
    client_header_timeout 30s;
    send_timeout 300s;
    keepalive_timeout 65s;

    # Uploads and results stream between the browser and the application. Nothing is spooled to nginx's own temporary directory,
    # which sits on the boot volume.
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrites, never appends: $remote_addr is the client address the CDN reported (real-ip above), so the application reads
    # exactly one hop that a client cannot forge (docs/client-ip-trust.md).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    # SYNC_DEADLINE_MAX_MS is 120 s by default; a synchronous conversion is answered or timed out by the application first. The free
    # plan of the CDN closes a request that waits more than 100 s for the first byte (HTTP 524), so a conversion that long is
    # started as a job and polled (docs/deploy-oci.md).
    proxy_read_timeout 130s;

    location = /api/health {
        proxy_pass http://easyconvert_web;
    }

    location ^~ /api/convert {
        limit_req zone=easyconvert_convert burst=10 nodelay;
        limit_conn easyconvert_conn 10;
        proxy_pass http://easyconvert_web;
    }

    location ^~ /api/v1/convert {
        limit_req zone=easyconvert_convert burst=10 nodelay;
        limit_conn easyconvert_conn 10;
        proxy_pass http://easyconvert_web;
    }

    location ^~ /api/v1/uploads {
        limit_req zone=easyconvert_api burst=60 nodelay;
        limit_conn easyconvert_conn 10;
        proxy_pass http://easyconvert_web;
    }

    location / {
        limit_req zone=easyconvert_api burst=60 nodelay;
        limit_conn easyconvert_conn 30;
        proxy_pass http://easyconvert_web;
    }
}
