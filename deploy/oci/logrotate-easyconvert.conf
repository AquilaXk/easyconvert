# Install: sudo install -m 0644 deploy/oci/logrotate-easyconvert.conf /etc/logrotate.d/easyconvert
/var/log/nginx/easyconvert-edge.log {
    daily
    rotate 7
    maxsize 50M
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        [ ! -f /run/nginx.pid ] || kill -USR1 "$(cat /run/nginx.pid)"
    endscript
}
