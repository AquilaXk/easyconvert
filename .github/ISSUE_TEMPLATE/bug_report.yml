name: "Bug Report"
description: "Report a bug or conversion failure in EasyConvert."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide reproducible steps and details for the bug.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce / Input Payload
      description: Specific input formats, parameters, or steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen and what actually occurred?
    validations:
      required: true
