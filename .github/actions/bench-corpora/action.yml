name: Public benchmark samples
description: >-
  Restores the verified downloads of the public sample sets (bench/corpus/remote-manifest.json) of the benchmark families a
  job runs, from the newest cache of the manifest's digest. The benchmark checks every file against the manifest's SHA-256
  whatever the cache holds (bench/corpora.ts), so a stale or damaged cache costs a download, never a wrong measurement. One
  cache per family: a job that measures one family restores only the files of that family. The nightly parity jobs save what
  they hold with ./.github/actions/bench-corpora-save, also when they fail, so a host that refuses a download one night is
  asked for fewer files the next.

inputs:
  families:
    description: Comma-separated benchmark families the job measures (image, video, audio, compression, document, pdf-ops, ebook, font, cad, raw, vector, data); others are ignored.
    required: true

runs:
  using: composite
  steps:
    - name: Restore the image samples
      if: contains(format(',{0},', inputs.families), ',image,')
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/image
        key: bench-corpora-image-${{ hashFiles('bench/corpus/remote-manifest.json') }}-${{ github.run_id }}
        restore-keys: |
          bench-corpora-image-${{ hashFiles('bench/corpus/remote-manifest.json') }}

    - name: Restore the video samples
      if: contains(format(',{0},', inputs.families), ',video,')
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/video
        key: bench-corpora-video-${{ hashFiles('bench/corpus/remote-manifest.json') }}-${{ github.run_id }}
        restore-keys: |
          bench-corpora-video-${{ hashFiles('bench/corpus/remote-manifest.json') }}

    - name: Restore the audio samples
