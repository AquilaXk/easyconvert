name: Public benchmark samples (documents, PDF, ebooks, fonts, CAD, RAW, vector, data)
description: >-
  Restores the verified downloads of the public sample sets (bench/corpus/public-manifest.json) of the benchmark families a
  job runs, and saves them when the job finishes, keyed by the digest of the manifest. The benchmark checks every file against
  the manifest's SHA-256 whatever the cache holds (bench/public-samples.ts), so a stale or damaged cache costs a download, never
  a wrong measurement. One cache per family: a job that measures one family restores only the files of that family.

inputs:
  families:
    description: Comma-separated benchmark families the job measures (document, pdf-ops, ebook, font, cad, raw, vector, data); others are ignored.
    required: true

runs:
  using: composite
  steps:
    - name: Cache the document samples
      if: contains(format(',{0},', inputs.families), ',document,')
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/document
        key: bench-public-samples-document-${{ hashFiles('bench/corpus/public-manifest.json') }}
        restore-keys: |
          bench-public-samples-document-

    - name: Cache the pdf-ops samples
      if: contains(format(',{0},', inputs.families), ',pdf-ops,')
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/pdf-ops
        key: bench-public-samples-pdf-ops-${{ hashFiles('bench/corpus/public-manifest.json') }}
        restore-keys: |
          bench-public-samples-pdf-ops-

    - name: Cache the ebook samples
      if: contains(format(',{0},', inputs.families), ',ebook,')
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/ebook
        key: bench-public-samples-ebook-${{ hashFiles('bench/corpus/public-manifest.json') }}
        restore-keys: |
          bench-public-samples-ebook-

    - name: Cache the font samples
      if: contains(format(',{0},', inputs.families), ',font,')
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/font
        key: bench-public-samples-font-${{ hashFiles('bench/corpus/public-manifest.json') }}
        restore-keys: |
          bench-public-samples-font-

    - name: Cache the cad samples
      if: contains(format(',{0},', inputs.families), ',cad,')
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/cad
        key: bench-public-samples-cad-${{ hashFiles('bench/corpus/public-manifest.json') }}
        restore-keys: |
          bench-public-samples-cad-

    - name: Cache the raw samples
      if: contains(format(',{0},', inputs.families), ',raw,')
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/raw
        key: bench-public-samples-raw-${{ hashFiles('bench/corpus/public-manifest.json') }}
        restore-keys: |
          bench-public-samples-raw-

    - name: Cache the vector samples
      if: contains(format(',{0},', inputs.families), ',vector,')
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/vector
        key: bench-public-samples-vector-${{ hashFiles('bench/corpus/public-manifest.json') }}
        restore-keys: |
          bench-public-samples-vector-

    - name: Cache the data samples
      if: contains(format(',{0},', inputs.families), ',data,')
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .bench-corpora/data
        key: bench-public-samples-data-${{ hashFiles('bench/corpus/public-manifest.json') }}
        restore-keys: |
          bench-public-samples-data-
