name: CI setup
description: >-
  Installs the conversion and oracle CLI tools, the Python format oracles and veraPDF, fetches the
  RAW samples, and starts the S3 test server. Shared by every CI job that runs test suites.

runs:
  using: composite
  steps:
    - name: Install external conversion and oracle CLI tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ffmpeg \
          7zip \
          poppler-utils \
          zstd \
          tar \
          libreoffice-calc \
          libreoffice-writer \
          libreoffice-impress \
          libreoffice-draw \
          imagemagick \
          tesseract-ocr \
          tesseract-ocr-kor \
          tesseract-ocr-jpn \
          fonts-nanum \
          fonts-noto-core \
          fonts-noto-cjk \
          libxml2-utils \
          flac \
          woff2 \
          python3-fonttools \
          python3-brotli \
          python3-fitz \
          fonts-noto-ui-core \
          fonts-noto-color-emoji \
          unrar \
          qpdf \
          ghostscript \
          libraw-bin \
          libavif-bin \
          libimage-exiftool-perl
        # Pre-stage Tesseract traineddata assets for offline inference
        find /usr/share/tesseract-ocr /usr/share/tessdata -name "*.traineddata" -exec cp -u {} ./ \; 2>/dev/null || true

    # Format oracles (columnar readers, PDF text extraction): the tests run python3 -I, which
    # ignores user site-packages, so the pinned packages go to the system interpreter.
    # --ignore-installed: the image ships an older distro PyMuPDF that pip cannot uninstall.
    # Test-only; nothing ships.
    - name: Install Python format oracles
      shell: bash
      run: sudo python3 -m pip install --no-cache-dir --break-system-packages --ignore-installed pyarrow==25.0.1 duckdb==1.5.6 pymupdf==1.28.2

    # PDF/A validator: PDF/A results are refused unless veraPDF validates them.
    - name: Install veraPDF
      shell: bash
      run: sudo scripts/install-verapdf.sh /opt/verapdf

    - name: Restore RAW sample cache
      uses: actions/cache@v4
      with:
        path: tests/fixtures/raw/.cache
        key: raw-fixtures-${{ hashFiles('tests/fixtures/raw/manifest.json', 'tests/fixtures/raw/variants.json') }}

    - name: Fetch RAW samples
      shell: bash
      run: npm run fixtures:raw

    # Real-server leg of the S3 storage tests, which read STORAGE_TEST_S3_*: a server this
    # repository did not write, which verifies SigV4 itself. It is started with `docker run`
    # because a service container cannot pass `server /data`. The image is pinned by digest; move
    # the pin if that image repository is removed. Anonymous registry pulls are rate limited, so the
    # pull is retried before the step fails.
    - name: Start the S3 test server
      env:
        S3_TEST_SERVER_IMAGE: bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
      shell: bash
      run: |
        pulled=0
        for attempt in 1 2 3; do
          if docker pull "$S3_TEST_SERVER_IMAGE"; then
            pulled=1
            break
          fi
          sleep $((attempt * 20))
        done
        if [ "$pulled" != 1 ]; then
          echo "could not pull $S3_TEST_SERVER_IMAGE after 3 attempts" >&2
          exit 1
        fi
        docker run -d --name s3-test-server -p 127.0.0.1:9000:9000 \
          -e MINIO_ROOT_USER="$STORAGE_TEST_S3_ACCESS_KEY_ID" \
          -e MINIO_ROOT_PASSWORD="$STORAGE_TEST_S3_SECRET_ACCESS_KEY" \
          "$S3_TEST_SERVER_IMAGE"
        ready=0
        for attempt in $(seq 1 30); do
          if curl -fsS --max-time 5 "$STORAGE_TEST_S3_ENDPOINT/minio/health/live" >/dev/null; then
            ready=1
            break
          fi
          sleep 2
        done
        if [ "$ready" != 1 ]; then
          echo "S3 test server did not become live after 30 attempts" >&2
          docker logs s3-test-server >&2
          exit 1
        fi

    # curl signs both requests with its own SigV4 implementation. The wrong secret must be refused,
    # otherwise the server would not enforce signatures and the client tests could not catch a
    # signing bug.
    - name: Create the S3 test bucket and check the server enforces signatures
      shell: bash
      run: |
        empty_sha256=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        sign() {
          curl -sS --max-time 10 -o /dev/null -w '%{http_code}' -X PUT \
            --user "$STORAGE_TEST_S3_ACCESS_KEY_ID:$1" --aws-sigv4 "aws:amz:us-east-1:s3" \
            -H "x-amz-content-sha256: $empty_sha256" "$STORAGE_TEST_S3_ENDPOINT/$2"
        }
        refused=$(sign "wrong-$STORAGE_TEST_S3_SECRET_ACCESS_KEY" signature-check)
        if [ "$refused" != 403 ]; then
          echo "expected 403 for a request signed with a wrong secret, got $refused" >&2
          exit 1
        fi
        created=$(sign "$STORAGE_TEST_S3_SECRET_ACCESS_KEY" "$STORAGE_TEST_S3_BUCKET")
        if [ "$created" != 200 ]; then
          echo "expected 200 creating $STORAGE_TEST_S3_BUCKET, got $created" >&2
          docker logs s3-test-server >&2
          exit 1
        fi
