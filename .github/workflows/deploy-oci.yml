name: Deploy to the OCI host

# Builds the arm64 images on every push to main that changes what they contain, and deploys a chosen build to the shared OCI A1 host on
# request (docs/deploy-oci.md). Nothing here runs on a schedule and nothing deploys by itself.
#
#   build   push to main: the worker image (Dockerfile.worker), then the web image (Dockerfile.web) on top of that exact worker digest,
#           both for linux/arm64, pushed to GHCR as sha-<commit> and main; the web image, and the main tag of the worker, only once
#           the web image started with the production container flags (scripts/boot-web-image.sh).
#   deploy  workflow_dispatch on main, in the environment easyconvert-production, on the runner whose only label is
#           easyconvert-production: pins the chosen build by digest, starts it, checks health and one conversion, and rolls back to the
#           previous release when either fails. The runner is separate from the one of the other service on this host and the job
#           reads and writes only /opt/easyconvert. The job log is public: it names digests and line numbers, never a secret value.
#           The steps `exec` deploy.sh, so the runner's cancel signals reach it and not a wrapper shell that would hold them back.
#
# Every push to main builds unless it changes only documentation or tests. The list is `paths` with negations rather than
# `paths-ignore`, because only `paths` can take a path back in after a negation, and the worker image copies THIRD_PARTY_NOTICES.md.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!tests/**'
      - '!**/*.md'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy a build, or roll back to the previous release'
        type: choice
        options: [deploy, rollback]
        default: deploy
      image_ref:
        description: 'Tag of the build to deploy: main (the latest build) or sha-<40 character commit>'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-oci-${{ github.event_name }}
  cancel-in-progress: false

env:
  WORKER_REPO: ghcr.io/aquilaxk/easyconvert-worker
  WEB_REPO: ghcr.io/aquilaxk/easyconvert-web

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sharplibvips stage compiles libvips; the layer cache keeps it, so only the first build and a change to that stage pay for it.
      # The web build reads this image by digest, so it is pushed under its commit tag here; main names it only after the web check.
      - name: Build and push the worker image
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.WORKER_REPO }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.WORKER_REPO }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.WORKER_REPO }}:buildcache-arm64,mode=max

      # The web image is loaded into the runner's Docker first and pushed only after it starts as production runs it, so a tag that
      # deploy can pull always names an image whose server answered (docs/policy-decisions.md, entry 141).
      - name: Build the web image on that worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          # The public origin is the host of deploy/oci/nginx-easyconvert.conf (tests/oci-deploy.test.ts holds the two together): the
          # prerendered pages name it in their canonical and hreflang links. It is no secret, and the push build has no access to
          # the environment secret that holds APP_URL for the running server.
          # ANONYMOUS_DAILY_LIMIT is the repository variable of that name, empty while it is unset (the build then uses the default
          # of src/lib/plan-limits.ts). Set it with the value the server runs with, so the prerendered pages name the same allowance.
          build-args: |
            WORKER_IMAGE=${{ env.WORKER_REPO }}@${{ steps.worker.outputs.digest }}
            APP_ORIGIN=https://convert.aquilaxk.site
            ANONYMOUS_DAILY_LIMIT=${{ vars.ANONYMOUS_DAILY_LIMIT }}
          tags: |
            ${{ env.WEB_REPO }}:sha-${{ github.sha }}
            ${{ env.WEB_REPO }}:main

      # The production container flags of docker-compose.prod.yml: read-only root, no capabilities, uid 10001, no new privileges,
      # the seccomp profile and noexec scratch. v0.7.0 passed a plain start and failed only under these flags (entry 141).
      - name: Start the web image as production runs it
        run: bash scripts/boot-web-image.sh "$WEB_REPO:sha-$GITHUB_SHA"

      - name: Push the web image
        id: web
        run: |
          set -euo pipefail
          docker push --quiet "$WEB_REPO:sha-$GITHUB_SHA"
          docker push --quiet "$WEB_REPO:main"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$WEB_REPO:sha-$GITHUB_SHA")"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Tag the worker image main
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: docker buildx imagetools create --prefer-index=false --tag "$WORKER_REPO:main" "$WORKER_REPO@$WORKER_DIGEST"

      # deploy.sh pins the digest it pulls for the worker and refuses a pair whose web image was built on another one, so main must
      # name the worker digest itself, not an index that wraps it.
      - name: Check that the worker main tag names the worker digest
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          tagged="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$WORKER_REPO:main")"
          if [ "$tagged" != "\"$WORKER_DIGEST\"" ]; then
            echo "::error::$WORKER_REPO:main names $tagged, not the worker image $WORKER_DIGEST"
            exit 1
          fi

      - name: Record the digests
        env:
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          {
            echo '### Images built for linux/arm64'
            echo "- worker: \`${WORKER_REPO}@${WORKER_DIGEST}\`"
            echo "- web: \`${WEB_REPO}@${WEB_DIGEST}\`"
            echo "- deploy it with the \`deploy-oci\` workflow and image_ref \`sha-${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: [easyconvert-production]
    environment: easyconvert-production
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Log in to the container registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The one secret is a KEY=VALUE file. Only the keys of deploy/oci/env-allowlist.txt are kept (a dropped line is logged by its
      # number, never by any of its text) and the result is a mode 0600 file in the job's temporary directory.
      - name: Filter the env secret through the allowlist
        if: inputs.action == 'deploy'
        env:
          EASYCONVERT_ENV: ${{ secrets.EASYCONVERT_ENV }}
        run: |
          set -euo pipefail
          [ -n "$EASYCONVERT_ENV" ] || { echo "the environment easyconvert-production has no secret EASYCONVERT_ENV" >&2; exit 1; }
          umask 077
          printf '%s\n' "$EASYCONVERT_ENV" | bash deploy/oci/deploy.sh filter-env > "$RUNNER_TEMP/easyconvert.env"
          echo "ENV_FILE=$RUNNER_TEMP/easyconvert.env" >> "$GITHUB_ENV"

      # ANONYMOUS_DAILY_LIMIT is the repository variable the web image was built with, the one source of the allowance: deploy.sh
      # passes it to the servers and refuses a web image built with another value.
      - name: Deploy, check health, roll back on failure
        if: inputs.action == 'deploy'
        env:
          SOURCE_DIR: ${{ github.workspace }}
          IMAGE_REF: ${{ inputs.image_ref }}
          ANONYMOUS_DAILY_LIMIT: ${{ vars.ANONYMOUS_DAILY_LIMIT }}
        run: exec bash deploy/oci/deploy.sh deploy "$IMAGE_REF"

      - name: Roll back to the previous release
        if: inputs.action == 'rollback'
        run: exec bash deploy/oci/deploy.sh rollback

      - name: Remove the filtered env file
        if: always()
        run: rm -f "$RUNNER_TEMP/easyconvert.env"
