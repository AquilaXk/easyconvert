name: 24h Endurance Soak Test

on:
  schedule:
    # Run once every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Soak duration (e.g. 1h, 6h, 24h)'
        required: true
        default: '1h'
      target_gb:
        description: 'Target payload size per cycle (in GB)'
        required: true
        default: '2'

permissions:
  contents: read

jobs:
  endurance-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install external conversion and oracle CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            7zip \
            poppler-utils \
            zstd \
            tar \
            libreoffice-calc \
            libreoffice-writer \
            libreoffice-impress

      # Wall-clock throughput floors are opt-in (PERF_BENCH=1) and run here, not in PR CI.
      # A slow shared runner must not cancel the endurance soak that follows.
      - name: Run streaming throughput benchmarks
        continue-on-error: true
        run: npm run bench:zstd

      - name: Run Endurance Soak Test
        env:
          SOAK_DURATION: ${{ github.event.inputs.duration || '24h' }}
          SOAK_TARGET_GB: ${{ github.event.inputs.target_gb || '2' }}
        run: |
          echo "Starting Endurance Soak: Duration=${SOAK_DURATION}, TargetGB=${SOAK_TARGET_GB}"
          npx tsx scripts/run-endurance-soak.ts --duration "${SOAK_DURATION}" --target-gb "${SOAK_TARGET_GB}"

      - name: Upload Soak Telemetry Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-telemetry
          path: tests/fixtures/soak-telemetry.json
          retention-days: 30

