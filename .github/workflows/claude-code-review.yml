name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are unavailable to fork PRs; skip drafts and forks.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        id: review
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'

      # Full output stays hidden; print only the final result text so a failed
      # run shows its error (for example an API or authentication error).
      - name: Show review failure reason
        if: failure() && steps.review.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          FALLBACK_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          file="${EXECUTION_FILE:-$FALLBACK_FILE}"
          if [ ! -f "$file" ]; then
            echo "::error::Execution output file not found: $file"
            exit 0
          fi
          jq -r '
            (if type == "array" then map(select(.type? == "result")) | last else . end)
            | "subtype=\(.subtype // "unknown") is_error=\(.is_error)\nresult=\(.result // "<no result text>")"
          ' "$file"
