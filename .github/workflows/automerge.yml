name: Automerge Label

# Turns the `automerge` label into GitHub auto-merge (squash). The `main`
# ruleset still gates the merge: required checks must pass and every review
# thread must be resolved. This workflow never checks out or runs PR code.
#
# Note: a merge enabled with GITHUB_TOKEN does not trigger `push` workflows on
# `main`; PR-level CI (`verify`) is the gate.
#
# Speed parity gates the merge through `verify`, not through this workflow. Adding the `automerge` label also starts a
# fresh CI run (ci.yml listens to `labeled`), whose `parity-speed` job is the last measurement before the merge, and a
# commit pushed after the label starts another. While a conversion family is changed and the label is missing,
# `verify` fails ("add the automerge label"), so auto-merge cannot fire early on a head that never had its speed
# measured; once the label is on, `verify` stays pending until `parity-speed` has finished on the current head.
# A PR that changes no conversion family needs no measurement and is merged as before.

on:
  pull_request_target:
    types: [labeled, unlabeled, ready_for_review, closed]

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    # Runs when the label is added to a ready PR, or when a labeled draft PR
    # is marked ready for review.
    if: >-
      (
        (github.event.action == 'labeled' && github.event.label.name == 'automerge') ||
        (github.event.action == 'ready_for_review' && contains(github.event.pull_request.labels.*.name, 'automerge'))
      ) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The squash commit takes the PR title and description, not the branch's commit messages, with tool
      # attribution lines removed. Title and body come in through the environment and are never interpolated into
      # the script.
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" \
            | grep -viE '^(co-authored-by:.*(claude|anthropic)|claude-session:|🤖 generated with|https://claude\.ai/code/session_)' \
            | awk '/^_Generated by \[Claude Code\]/ { if (held == "---") pending = 0; next }
                   { if (pending) print held; held = $0; pending = 1 }
                   END { if (pending) print held }' \
            > "$RUNNER_TEMP/squash-body.md" || true
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --subject "$PR_TITLE (#$PR_NUMBER)" --body-file "$RUNNER_TEMP/squash-body.md"

  disable:
    if: >-
      github.event.action == 'unlabeled' &&
      github.event.label.name == 'automerge' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.auto_merge != null &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --disable-auto

  # A merge performed through GITHUB_TOKEN does not fire the `Closes #N`
  # keywords, so close the PR's linked issues explicitly after it merges.
  close-linked-issues:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close issues linked by closing keywords
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          # $owner/$repo/$pr in the query are GraphQL variables, not shell expansions.
          # shellcheck disable=SC2016
          issues=$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){closingIssuesReferences(first:20){nodes{number state repository{nameWithOwner}}}}}}' \
            -f owner="$owner" -f repo="$repo" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.state == "OPEN" and .repository.nameWithOwner == env.GITHUB_REPOSITORY) | .number')
          for issue in $issues; do
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Resolved by #$PR_NUMBER (merged)."
          done
