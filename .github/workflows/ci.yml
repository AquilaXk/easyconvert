name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The unit and integration suites run in parallel shards. `verify`, the required check, passes only
  # when every shard and the checks job pass.
  tests:
    name: tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # Real Redis for the queue suites that exercise Lua transitions, heartbeats,
    # and stall recovery (an in-process mock cannot execute Lua).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Dummy credentials of the throwaway S3 test server started below, shared by the steps that
    # start it and by the storage tests that read STORAGE_TEST_S3_*.
    env:
      STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      STORAGE_TEST_S3_ACCESS_KEY_ID: ci-s3-access-key
      STORAGE_TEST_S3_SECRET_ACCESS_KEY: ci-s3-secret-key
      STORAGE_TEST_S3_BUCKET: easyconvert-client-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install tools and start test services
        uses: ./.github/actions/ci-setup

      - name: Run unit and integration tests
        env:
          ORACLE_STRICT_MODE: "1"
        run: npx --no-install vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  checks:
    runs-on: ubuntu-latest

    # Real Redis for the queue suites that exercise Lua transitions, heartbeats,
    # and stall recovery (an in-process mock cannot execute Lua).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Dummy credentials of the throwaway S3 test server started below, shared by the steps that
    # start it and by the storage tests that read STORAGE_TEST_S3_*.
    env:
      STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      STORAGE_TEST_S3_ACCESS_KEY_ID: ci-s3-access-key
      STORAGE_TEST_S3_SECRET_ACCESS_KEY: ci-s3-secret-key
      STORAGE_TEST_S3_BUCKET: easyconvert-client-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install tools and start test services
        uses: ./.github/actions/ci-setup

      - name: Verify test integrity and anti-cheating guards
        run: npm run guard:anti-cheat

      - name: Run linter
        run: npm run lint

      # The worker image ships only the pinned upstream 7-Zip build, so run the archive suites
      # against that exact binary too. URL and digest mirror Dockerfile.worker (x64).
      - name: Run archive tests against pinned 7-Zip
        env:
          ORACLE_STRICT_MODE: "1"
          SEVEN_ZIP_VERSION: "26.01"
          SEVEN_ZIP_RELEASE: "2601"
          SEVEN_ZIP_SHA256_X64: 8ea0fc8a135e7b848e80a4116fe22dff56c8c4518dde1f43cce67f4e340b437a
        run: |
          SEVEN_ZIP_DIR="${RUNNER_TEMP}/seven-zip"
          mkdir -p "${SEVEN_ZIP_DIR}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "${SEVEN_ZIP_DIR}/7zip.tar.xz" \
            "https://github.com/ip7z/7zip/releases/download/${SEVEN_ZIP_VERSION}/7z${SEVEN_ZIP_RELEASE}-linux-x64.tar.xz"
          echo "${SEVEN_ZIP_SHA256_X64}  ${SEVEN_ZIP_DIR}/7zip.tar.xz" | sha256sum --check --strict -
          tar -xJf "${SEVEN_ZIP_DIR}/7zip.tar.xz" -C "${SEVEN_ZIP_DIR}" 7zzs
          "${SEVEN_ZIP_DIR}/7zzs" i | grep -q ' Rar5 '
          P7ZIP_PATH="${SEVEN_ZIP_DIR}/7zzs" npx --no-install vitest run \
            tests/*archive* tests/*7z* tests/*rar* tests/worker-seven-zip-packaging.test.ts

      # Kept separate from `npm test`: some suites assume no Redis is configured.
      - name: Run Redis-mode queue tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

      - name: Build application
        run: npm run build

  verify:
    if: always()
    needs: [tests, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard and the checks job to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          echo "tests: $TESTS_RESULT, checks: $CHECKS_RESULT"
          if [ "$TESTS_RESULT" != success ] || [ "$CHECKS_RESULT" != success ]; then
            exit 1
          fi
