name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install external conversion and oracle CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            p7zip-full \
            poppler-utils \
            zstd \
            tar \
            libreoffice-calc \
            libreoffice-writer \
            libreoffice-impress \
            imagemagick \
            tesseract-ocr \
            tesseract-ocr-kor \
            fonts-nanum \
            unrar
          # Pre-stage Tesseract traineddata assets for offline inference
          find /usr/share/tesseract-ocr /usr/share/tessdata -name "*.traineddata" -exec cp -u {} ./ \; 2>/dev/null || true

      - name: Verify test integrity and anti-cheating guards
        run: npm run guard:anti-cheat

      - name: Run linter
        run: npm run lint

      - name: Run unit and integration tests
        env:
          ORACLE_STRICT_MODE: "1"
        run: npm test

      - name: Build application
        run: npm run build
