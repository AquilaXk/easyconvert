name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Real Redis for the queue suites that exercise Lua transitions, heartbeats,
    # and stall recovery (an in-process mock cannot execute Lua).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Dummy credentials of the throwaway S3 test server started below, shared by the steps that
    # start it and by the storage tests that read STORAGE_TEST_S3_*.
    env:
      STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      STORAGE_TEST_S3_ACCESS_KEY_ID: ci-s3-access-key
      STORAGE_TEST_S3_SECRET_ACCESS_KEY: ci-s3-secret-key
      STORAGE_TEST_S3_BUCKET: easyconvert-client-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install external conversion and oracle CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            p7zip-full \
            poppler-utils \
            zstd \
            tar \
            libreoffice-calc \
            libreoffice-writer \
            libreoffice-impress \
            libreoffice-draw \
            imagemagick \
            tesseract-ocr \
            tesseract-ocr-kor \
            tesseract-ocr-jpn \
            fonts-nanum \
            fonts-noto-core \
            fonts-noto-cjk \
            libxml2-utils \
            flac \
            woff2 \
            python3-fonttools \
            python3-brotli \
            python3-fitz \
            fonts-noto-ui-core \
            fonts-noto-color-emoji \
            unrar \
            qpdf \
            libraw-bin
          # Pre-stage Tesseract traineddata assets for offline inference
          find /usr/share/tesseract-ocr /usr/share/tessdata -name "*.traineddata" -exec cp -u {} ./ \; 2>/dev/null || true

      # Format oracles (columnar readers, PDF text extraction): the tests run python3 -I, which
      # ignores user site-packages, so the pinned packages go to the system interpreter.
      # --ignore-installed: the image ships an older distro PyMuPDF that pip cannot uninstall.
      # Test-only; nothing ships.
      - name: Install Python format oracles
        run: sudo python3 -m pip install --no-cache-dir --break-system-packages --ignore-installed pyarrow==25.0.1 duckdb==1.5.6 pymupdf==1.28.2

      - name: Verify test integrity and anti-cheating guards
        run: npm run guard:anti-cheat

      - name: Run linter
        run: npm run lint

      - name: Restore RAW sample cache
        uses: actions/cache@v4
        with:
          path: tests/fixtures/raw/.cache
          key: raw-fixtures-${{ hashFiles('tests/fixtures/raw/manifest.json', 'tests/fixtures/raw/variants.json') }}

      - name: Fetch RAW samples
        run: npm run fixtures:raw

      # Real-server leg of the S3 storage tests, which read STORAGE_TEST_S3_*: a server this
      # repository did not write, which verifies SigV4 itself. It is started with `docker run`
      # because a service container cannot pass `server /data`. The image is pinned by digest. The
      # upstream minio/minio images are no longer pullable (quay.io answers "unauthorized" and Docker
      # Hub lists no tags), so this is the last Bitnami-packaged release of the same server.
      - name: Start the S3 test server
        env:
          S3_TEST_SERVER_IMAGE: bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
        run: |
          docker run -d --name s3-test-server -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$STORAGE_TEST_S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$STORAGE_TEST_S3_SECRET_ACCESS_KEY" \
            "$S3_TEST_SERVER_IMAGE"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$STORAGE_TEST_S3_ENDPOINT/minio/health/live" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "S3 test server did not become live within 60 seconds" >&2
            docker logs s3-test-server >&2
            exit 1
          fi

      # curl signs both requests with its own SigV4 implementation. The wrong secret must be refused,
      # otherwise the server would not enforce signatures and the client tests could not catch a
      # signing bug.
      - name: Create the S3 test bucket and check the server enforces signatures
        run: |
          empty_sha256=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          sign() {
            curl -sS -o /dev/null -w '%{http_code}' -X PUT \
              --user "$STORAGE_TEST_S3_ACCESS_KEY_ID:$1" --aws-sigv4 "aws:amz:us-east-1:s3" \
              -H "x-amz-content-sha256: $empty_sha256" "$STORAGE_TEST_S3_ENDPOINT/$2"
          }
          refused=$(sign "wrong-$STORAGE_TEST_S3_SECRET_ACCESS_KEY" signature-check)
          if [ "$refused" != 403 ]; then
            echo "expected 403 for a request signed with a wrong secret, got $refused" >&2
            exit 1
          fi
          created=$(sign "$STORAGE_TEST_S3_SECRET_ACCESS_KEY" "$STORAGE_TEST_S3_BUCKET")
          if [ "$created" != 200 ]; then
            echo "expected 200 creating $STORAGE_TEST_S3_BUCKET, got $created" >&2
            docker logs s3-test-server >&2
            exit 1
          fi

      - name: Run unit and integration tests
        env:
          ORACLE_STRICT_MODE: "1"
        run: npm test

      # Kept separate from `npm test`: some suites assume no Redis is configured.
      - name: Run Redis-mode queue tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

      - name: Build application
        run: npm run build
