name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The unit and integration suites and the registry conformance gate run in parallel shards. `verify`,
  # the required check, passes only when every shard, every conformance part, the checks job and the
  # container job pass.
  tests:
    name: tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # Real Redis for the queue suites that exercise Lua transitions, heartbeats,
    # and stall recovery (an in-process mock cannot execute Lua).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Dummy credentials of the throwaway S3 test server started below, shared by the steps that
    # start it and by the storage tests that read STORAGE_TEST_S3_*.
    env:
      STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      STORAGE_TEST_S3_ACCESS_KEY_ID: ci-s3-access-key
      STORAGE_TEST_S3_SECRET_ACCESS_KEY: ci-s3-secret-key
      STORAGE_TEST_S3_BUCKET: easyconvert-client-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install tools and start test services
        uses: ./.github/actions/ci-setup

      - name: Run unit and integration tests
        env:
          ORACLE_STRICT_MODE: "1"
        # The registry conformance gate runs in its own parallel job below.
        run: npx --no-install vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }} --exclude tests/registry-engine-conformance.test.ts --exclude 'tests/**/*.perf.test.ts'

  conformance:
    name: conformance (${{ matrix.part }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]

    # Real Redis for the queue suites that exercise Lua transitions, heartbeats,
    # and stall recovery (an in-process mock cannot execute Lua).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Dummy credentials of the throwaway S3 test server started below, shared by the steps that
    # start it and by the storage tests that read STORAGE_TEST_S3_*.
    env:
      STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      STORAGE_TEST_S3_ACCESS_KEY_ID: ci-s3-access-key
      STORAGE_TEST_S3_SECRET_ACCESS_KEY: ci-s3-secret-key
      STORAGE_TEST_S3_BUCKET: easyconvert-client-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install tools and start test services
        uses: ./.github/actions/ci-setup

      # Every advertised registry pair through a real engine run; each part covers a disjoint share of the
      # pairs (CONFORMANCE_PART), and part 1 also runs the registry-wide checks.
      - name: Run the registry conformance gate
        env:
          ORACLE_STRICT_MODE: "1"
          CONFORMANCE_PART: ${{ matrix.part }}/${{ strategy.job-total }}
        run: npx --no-install vitest run tests/registry-engine-conformance.test.ts

  checks:
    runs-on: ubuntu-latest

    # Real Redis for the queue suites that exercise Lua transitions, heartbeats,
    # and stall recovery (an in-process mock cannot execute Lua).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Dummy credentials of the throwaway S3 test server started below, shared by the steps that
    # start it and by the storage tests that read STORAGE_TEST_S3_*.
    env:
      STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      STORAGE_TEST_S3_ACCESS_KEY_ID: ci-s3-access-key
      STORAGE_TEST_S3_SECRET_ACCESS_KEY: ci-s3-secret-key
      STORAGE_TEST_S3_BUCKET: easyconvert-client-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install tools and start test services
        uses: ./.github/actions/ci-setup

      - name: Verify test integrity and anti-cheating guards
        run: npm run guard:anti-cheat

      - name: Run linter
        run: npm run lint

      # Performance suites saturate the CPUs (parallel engine workers, speedup ratios); they run here one
      # file at a time so they neither starve the timing-sensitive tests in the shards nor get starved.
      - name: Run performance suites
        env:
          ORACLE_STRICT_MODE: "1"
        run: npx --no-install vitest run --no-file-parallelism .perf.test.ts

      # The worker image ships only the pinned upstream 7-Zip build, so run the archive suites
      # against that exact binary too. URL and digest mirror Dockerfile.worker (x64).
      - name: Run archive tests against pinned 7-Zip
        env:
          ORACLE_STRICT_MODE: "1"
          SEVEN_ZIP_VERSION: "26.01"
          SEVEN_ZIP_RELEASE: "2601"
          SEVEN_ZIP_SHA256_X64: 8ea0fc8a135e7b848e80a4116fe22dff56c8c4518dde1f43cce67f4e340b437a
        run: |
          SEVEN_ZIP_DIR="${RUNNER_TEMP}/seven-zip"
          mkdir -p "${SEVEN_ZIP_DIR}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "${SEVEN_ZIP_DIR}/7zip.tar.xz" \
            "https://github.com/ip7z/7zip/releases/download/${SEVEN_ZIP_VERSION}/7z${SEVEN_ZIP_RELEASE}-linux-x64.tar.xz"
          echo "${SEVEN_ZIP_SHA256_X64}  ${SEVEN_ZIP_DIR}/7zip.tar.xz" | sha256sum --check --strict -
          tar -xJf "${SEVEN_ZIP_DIR}/7zip.tar.xz" -C "${SEVEN_ZIP_DIR}" 7zzs
          "${SEVEN_ZIP_DIR}/7zzs" i | grep -q ' Rar5 '
          P7ZIP_PATH="${SEVEN_ZIP_DIR}/7zzs" npx --no-install vitest run \
            tests/*archive* tests/*7z* tests/*rar* tests/worker-seven-zip-packaging.test.ts

      # Kept separate from `npm test`: some suites assume no Redis is configured.
      - name: Run Redis-mode queue tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

      - name: Build application
        run: npm run build

  # Builds the worker image and proves the container hardening from inside a container started with the
  # compose security settings (scripts/verify-worker-container.sh). It runs in parallel with the other
  # jobs and does the work only when a file that affects the image, its compose settings or the sandbox
  # changed; otherwise it succeeds at once, so `verify` can always require it.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Files whose change can alter the worker container or its sandbox.
      CONTAINER_PATHS: '^(Dockerfile\.worker$|docker/|docker-compose[^/]*\.yml$|scripts/verify-worker-container\.sh$|src/lib/security/process-sandbox\.ts$|\.github/workflows/ci\.yml$|\.github/actions/)'
      WORKER_IMAGE: easyconvert-worker:ci
      REDIS_PORT: '6379'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decide whether the container changed
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Fail open: when the base commit cannot be compared, run the checks.
          zero_sha=0000000000000000000000000000000000000000
          relevant=true
          if [ "$EVENT_NAME" = pull_request ]; then base="$PR_BASE_SHA"; else base="$PUSH_BEFORE_SHA"; fi
          if [ -n "$base" ] && [ "$base" != "$zero_sha" ] && git fetch --no-tags --depth=1 origin "$base"; then
            changed="$(git diff --name-only "$base" HEAD)"
            printf 'changed files:\n%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -Eq "$CONTAINER_PATHS"; then
              echo "container paths changed: running the container checks"
            else
              relevant=false
              echo "skipped: no container changes"
            fi
          else
            echo "no comparable base commit: running the container checks"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      # The in-container `unshare -r -n` needs unprivileged user namespaces; recent runner images restrict
      # them for AppArmor-confined programs by default.
      - name: Allow unprivileged user namespaces
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up Docker Buildx
        if: steps.changes.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the worker image
        if: steps.changes.outputs.relevant == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.worker
          load: true
          tags: ${{ env.WORKER_IMAGE }}
          cache-from: type=gha,scope=worker-container
          cache-to: type=gha,mode=max,scope=worker-container

      # Redis runs as the compose service so the worker container can reach it over the project network.
      - name: Start Redis
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          docker compose up -d redis
          for attempt in $(seq 1 30); do
            if [ "$(docker compose exec -T redis redis-cli ping 2>/dev/null)" = PONG ]; then exit 0; fi
            sleep 1
          done
          echo "Redis did not answer PING after 30 attempts" >&2
          docker compose logs redis >&2
          exit 1

      # The worker service from docker-compose.yml (read_only, cap_drop ALL, no-new-privileges, the seccomp
      # profile, nodev/noexec tmpfs), run against the image built above.
      - name: Verify the hardened worker container
        if: steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          override="$RUNNER_TEMP/compose.ci-image.yml"
          printf 'services:\n  worker:\n    image: %s\n    pull_policy: never\n' "$WORKER_IMAGE" > "$override"
          redis_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' easyconvert-redis)"
          echo "Redis container address: $redis_ip"
          docker compose -f docker-compose.yml -f "$override" run --rm --no-deps -T \
            -e VERIFY_REDIS_HOST="$redis_ip" -e VERIFY_REDIS_PORT="$REDIS_PORT" \
            -v "$PWD/scripts/verify-worker-container.sh:/verify.sh:ro" \
            --entrypoint /bin/bash worker /verify.sh | tee "$RUNNER_TEMP/verify-worker-container.log"

      - name: Publish the verification output
        if: always() && steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/verify-worker-container.log" ]; then
            { echo '### Worker container verification'; echo '```'; cat "$RUNNER_TEMP/verify-worker-container.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show container state after a failure
        if: failure() && steps.changes.outputs.relevant == 'true'
        shell: bash
        run: |
          docker compose ps -a
          docker compose logs --no-color redis

      - name: Stop Redis
        if: always() && steps.changes.outputs.relevant == 'true'
        run: docker compose down --volumes

  verify:
    if: always()
    needs: [tests, conformance, checks, container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard, the checks job and the container job to pass
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          echo "tests: $TESTS_RESULT, conformance: $CONFORMANCE_RESULT, checks: $CHECKS_RESULT, container: $CONTAINER_RESULT"
          if [ "$TESTS_RESULT" != success ] || [ "$CONFORMANCE_RESULT" != success ] || [ "$CHECKS_RESULT" != success ] || [ "$CONTAINER_RESULT" != success ]; then
            exit 1
          fi
