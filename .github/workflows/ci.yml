name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Real Redis for the queue suites that exercise Lua transitions, heartbeats,
    # and stall recovery (an in-process mock cannot execute Lua).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install external conversion and oracle CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            p7zip-full \
            poppler-utils \
            zstd \
            tar \
            libreoffice-calc \
            libreoffice-writer \
            libreoffice-impress \
            libreoffice-draw \
            imagemagick \
            tesseract-ocr \
            tesseract-ocr-kor \
            tesseract-ocr-jpn \
            fonts-nanum \
            fonts-noto-core \
            fonts-noto-cjk \
            libxml2-utils \
            flac \
            woff2 \
            python3-fonttools \
            python3-brotli \
            python3-fitz \
            fonts-noto-ui-core \
            fonts-noto-color-emoji \
            unrar \
            qpdf \
            libraw-bin
          # Pre-stage Tesseract traineddata assets for offline inference
          find /usr/share/tesseract-ocr /usr/share/tessdata -name "*.traineddata" -exec cp -u {} ./ \; 2>/dev/null || true

      # Format oracles (columnar readers, PDF text extraction): the tests run python3 -I, which
      # ignores user site-packages,
      # so the pinned packages are installed for the system interpreter. Test-only; nothing ships.
      - name: Install Python format oracles
        run: sudo python3 -m pip install --no-cache-dir --break-system-packages pyarrow==25.0.1 duckdb==1.5.6 pymupdf==1.28.2

      - name: Verify test integrity and anti-cheating guards
        run: npm run guard:anti-cheat

      - name: Run linter
        run: npm run lint

      - name: Restore RAW sample cache
        uses: actions/cache@v4
        with:
          path: tests/fixtures/raw/.cache
          key: raw-fixtures-${{ hashFiles('tests/fixtures/raw/manifest.json', 'tests/fixtures/raw/variants.json') }}

      - name: Fetch RAW samples
        run: npm run fixtures:raw

      - name: Run unit and integration tests
        env:
          ORACLE_STRICT_MODE: "1"
        run: npm test

      # Kept separate from `npm test`: some suites assume no Redis is configured.
      - name: Run Redis-mode queue tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

      - name: Build application
        run: npm run build
