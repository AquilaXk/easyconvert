name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Real Redis for the queue suites that exercise Lua transitions, heartbeats,
    # and stall recovery (an in-process mock cannot execute Lua).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install external conversion and oracle CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            p7zip-full \
            poppler-utils \
            zstd \
            tar \
            libreoffice-calc \
            libreoffice-writer \
            libreoffice-impress \
            libreoffice-draw \
            imagemagick \
            tesseract-ocr \
            tesseract-ocr-kor \
            fonts-nanum \
            fonts-noto-core \
            fonts-noto-ui-core \
            fonts-noto-color-emoji \
            unrar \
            qpdf \
            libraw-bin
          # Pre-stage Tesseract traineddata assets for offline inference
          find /usr/share/tesseract-ocr /usr/share/tessdata -name "*.traineddata" -exec cp -u {} ./ \; 2>/dev/null || true

      - name: Verify test integrity and anti-cheating guards
        run: npm run guard:anti-cheat

      - name: Run linter
        run: npm run lint

      - name: Restore RAW sample cache
        uses: actions/cache@v4
        with:
          path: tests/fixtures/raw/.cache
          key: raw-fixtures-${{ hashFiles('tests/fixtures/raw/manifest.json', 'tests/fixtures/raw/variants.json') }}

      - name: Fetch RAW samples
        run: npm run fixtures:raw

      # Independent S3-compatible server for the real-server storage tests: they verify SigV4 and
      # multipart semantics against an implementation this repository did not write. Official images
      # are started by hand because a service container cannot pass `server /data`.
      - name: Start MinIO
        env:
          MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          MINIO_ROOT_USER: ci-minio-access-key
          MINIO_ROOT_PASSWORD: ci-minio-secret-key
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD \
            "$MINIO_IMAGE" server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become live within 60 seconds" >&2
          docker logs minio >&2
          exit 1

      - name: Create the MinIO test bucket
        env:
          MC_IMAGE: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          MINIO_ROOT_USER: ci-minio-access-key
          MINIO_ROOT_PASSWORD: ci-minio-secret-key
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD "$MC_IMAGE" \
            -c 'mc alias set ci http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing ci/easyconvert-client-test'

      - name: Run unit and integration tests
        env:
          ORACLE_STRICT_MODE: "1"
          STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          STORAGE_TEST_S3_ACCESS_KEY_ID: ci-minio-access-key
          STORAGE_TEST_S3_SECRET_ACCESS_KEY: ci-minio-secret-key
          STORAGE_TEST_S3_BUCKET: easyconvert-client-test
        run: npm test

      # Kept separate from `npm test`: some suites assume no Redis is configured.
      - name: Run Redis-mode queue tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:redis

      - name: Build application
        run: npm run build
