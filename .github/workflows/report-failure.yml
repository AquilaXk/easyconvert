name: Report a failed scheduled run

# Opens one issue labelled `nightly-regression` for a failing scheduled run, or comments on the one that is already open, so a
# streak of failures stays in one place. Called by the jobs that gate a scheduled workflow (nightly.yml, regression-corpus.yml),
# which decide when to call it: `if: always() && contains(needs.*.result, 'failure')`. The run it reports is the caller's.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Open or update the nightly-regression issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const label = 'nightly-regression';
            const title = 'Nightly regression';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });
            const failed = jobs.filter((job) => job.conclusion === 'failure');
            const lines = failed.map((job) => `- [${job.name}](${job.html_url})`);
            const body = [
              `Run [${context.runId}](${runUrl}) failed on ${context.sha.slice(0, 7)}.`,
              '',
              'Failing jobs:',
              ...(lines.length > 0 ? lines : ['- (the failing job could not be listed)']),
            ].join('\n');

            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 1 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
              return;
            }
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'A scheduled check failed' });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.create({ owner, repo, title, labels: [label], body });
