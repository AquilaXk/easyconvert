name: segv probe

on:
  push:
    branches: [fix/pdf-html-segv]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant:
          - default-a
          - default-b
          - budget-a
          - budget-b
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/sharp-libvips
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/easyconvert-realworld
          key: realworld-5-${{ hashFiles('bench/realworld/manifest.json') }}
          restore-keys: realworld-5-
      - name: Enable core dumps
        run: |
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p
          sudo apt-get install -y gdb > /dev/null
          npm run build:pdf-text-worker
      - name: Stress
        run: |
          ulimit -c unlimited
          flags=""
          case "${{ matrix.variant }}" in budget-*) flags="--wasm-wrapper-tiering-budget=2147483647" ;; esac
          crashes=0
          for run in $(seq 1 14); do
            node $flags .github/segv-probe/wrapper-churn.mjs 4 60 || { crashes=$((crashes + 1)); echo "run $run exit $?"; }
          done
          echo "RESULT ${{ matrix.variant }} runs=14 crashes=$crashes"
          ls /tmp/cores
      - name: Backtraces
        if: always()
        run: |
          shopt -s nullglob
          for core in $(ls /tmp/cores/core.* 2>/dev/null | head -2); do
            echo "=== $core"
            gdb -q -batch -ex 'bt 25' "$(command -v node)" "$core" 2>&1 | grep -v '^warning' | head -60
          done
