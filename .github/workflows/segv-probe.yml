name: segv probe

on:
  push:
    branches: [fix/pdf-html-segv]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [a, b, c, d]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - uses: ./.github/actions/sharp-libvips
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/easyconvert-realworld
          key: realworld-5-${{ hashFiles('bench/realworld/manifest.json') }}
          restore-keys: realworld-5-
      - uses: ./.github/actions/ci-setup
      - uses: ./.github/actions/pinned-7zip
        with:
          export-env: "true"
      - name: Enable core dumps
        run: |
          sudo mkdir -p /tmp/cores && sudo chmod 1777 /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%e.%p
          sudo apt-get install -y gdb > /dev/null
          echo built
      - name: Stress
        run: |
          ulimit -c unlimited
          end=$((SECONDS + 1800)); run=0
          while [ $SECONDS -lt $end ]; do
            run=$((run + 1))
            npx --no-install tsx bench/realworld/run.ts run --shard 5/10 --limit 335 --out "rw-$run.json" > "rw-$run.log" 2>&1
            node -e "const j=require('./rw-$run.json').jobs; console.log('replay $run', JSON.stringify(j.filter(r=>r.verdict==='crash'||r.verdict==='hang')))"
          done
          ls /tmp/cores
      - name: Backtraces
        if: always()
        run: |
          shopt -s nullglob
          for core in /tmp/cores/core.*; do
            pid="${core##*.}"
            echo "=== $core"
            echo "--- last events of $pid"
            tail -40 "/tmp/probe/$pid.log"
            gdb -q -batch -ex 'info threads' -ex 'thread apply all bt 30' "$(command -v node)" "$core" 2>&1 | grep -v '^warning' | head -900
          done
