sonar.projectKey=AquilaXk_easyconvert
sonar.organization=aquilaxk
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.exclusions=tests/fixtures/**,public/**,scripts/**,sdk/**
sonar.cpd.exclusions=src/lib/storage/**,src/lib/registry.ts,src/lib/slug-parser.ts,src/lib/conversions/cad-nurbs.ts,src/lib/conversions/ocr-pdf-combiner.ts,src/lib/edge-ocr/**,src/lib/jobs/**,app/**,app/**/*,src/app/**,src/app/**/*,**/*page.tsx,src/components/Footer.tsx,tests/**,**/tests/**,**/*.test.ts,sdk/**
# RAR fixture generators implement the archive format, which mandates AES-CBC and SHA-1 key derivation.
sonar.issue.ignore.multicriteria=rarCbc,rarSha1
sonar.issue.ignore.multicriteria.rarCbc.ruleKey=typescript:S5542
sonar.issue.ignore.multicriteria.rarCbc.resourceKey=tests/helpers/rar*.ts
sonar.issue.ignore.multicriteria.rarSha1.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.rarSha1.resourceKey=tests/helpers/rar*.ts
