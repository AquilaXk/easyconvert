# The Haskell packages statically linked into the pinned pandoc 3.1.11 release programs (scripts/install-pandoc.sh), one per line:
#   <package> <version> <SHA-256 of its Hackage source archive> <origin>
# The archive is https://hackage.haskell.org/package/<package>-<version>/<package>-<version>.tar.gz. The pandoc packages themselves
# (pandoc, pandoc-cli, pandoc-lua-engine, pandoc-server: GPL-2.0-or-later) are the program and are covered by /licenses/pandoc.copyright.
# Origins:
#   binary  the unit id of the package (`<package>-<version>-<hash>`, or `<package>-<version>` for a GHC library) is a string of both pinned
#           release programs (the amd64 and the aarch64 one carry the same 187 ids); `npx tsx scripts/generate-pandoc-notices.ts --verify-binary <pandoc>`
#           lists them again.
#   plan    a dependency of the `binary` packages that their library lists outside any `if` and that leaves no unit id in the program
#           (a package whose code the linker keeps without a type or an exception to name it); the version is the one of Stackage LTS 22.0
#           (GHC 9.6.3), which matches the program for every `binary` package but the three that stack.yaml or cabal.project of the tagged commit
#           moves. Over-inclusion is the safe direction for a notices file.
#   ghc     a library of the GHC 9.6.3 that built the programs (the ghc-boot-th unit id names it) that leaves no unit id.
# Regenerate the notices after any change: npx tsx scripts/generate-pandoc-notices.ts
